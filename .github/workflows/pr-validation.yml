name: Hypercraft PR Validation

on:
  workflow_call:

jobs:
  validate:
    name: Validate PR
    runs-on: ubuntu-latest

    permissions:
      pull-requests: read

    steps:
      - name: Validate PR requirements
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.setFailed('This workflow requires a pull request event.');
              return;
            }
            if (pr.base.ref !== 'main') {
              core.info('Development PR: validation not required.');
              return;
            }

            const body = (pr.body || '').replace(/<!--[^]*?-->/g, '');
            const errors = [];
            const escapeRegExp = value => value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const checked = label => new RegExp(`^\\s*- \\[x\\] \\*\\*${escapeRegExp(label)}\\*\\*\\s*$`, 'im').test(body);
            const declared = label => new RegExp(`^\\s*- \\[x\\] ${escapeRegExp(label)}\\s*$`, 'im').test(body);

            function section(name) {
              const lines = body.split(/\r?\n/);
              const heading = `## ${name}`;
              const start = lines.findIndex(line => line.trim() === heading);
              if (start < 0) return null;
              const end = lines.findIndex((line, index) => index > start && /^##\s+/.test(line));
              return lines.slice(start + 1, end < 0 ? undefined : end).join('\n').trim();
            }
            function subsection(name, parent) {
              const content = section(parent);
              if (content === null) return null;
              const lines = content.split(/\r?\n/);
              const start = lines.findIndex(line => line.trim() === `### ${name}`);
              if (start < 0) return null;
              const end = lines.findIndex((line, index) => index > start && /^###\s+/.test(line));
              return lines.slice(start + 1, end < 0 ? undefined : end).join('\n').trim();
            }
            // Text after a bold "**Label:**" line within a section, up to the end of that section.
            function labeled(label, parent) {
              const content = section(parent);
              if (content === null) return null;
              const marker = `**${label}:**`;
              const start = content.indexOf(marker);
              if (start < 0) return null;
              return content.slice(start + marker.length).trim();
            }
            const hasContent = value => value !== null && value.trim().length > 0;
            const substantive = value => hasContent(value) && !/^(n\/?a|none|tbd|todo|pending)$/i.test(value.trim());

            if (!substantive(section('Summary'))) errors.push('Provide a meaningful Summary.');
            if (!substantive(section('Work Item'))) errors.push('Provide a work item reference or an explanation for a minor administrative exception.');

            const risk = ['L0', 'L1', 'L2', 'L3'].filter(level =>
              new RegExp(`^\\s*- \\[x\\] ${level}\\s+-`, 'im').test(body)
            );
            if (risk.length !== 1) errors.push('Select exactly one L0–L3 risk classification.');

            if (section('Implementation') === null) errors.push('Include the Implementation section (N/A is acceptable).');
            if (checked('Breaking Changes') && !substantive(labeled('Breaking Change Details', 'Implementation'))) {
              errors.push('Describe compatibility impacts and migration steps for breaking changes.');
            }

            const verification = subsection('Verification Performed', 'Verification');
            if (!substantive(verification) && !(hasContent(verification) && /^n\/?a\s*[-:,(]/i.test(verification))) {
              errors.push('Describe verification performed, or explain why it is not applicable.');
            }
            if (!hasContent(subsection('Known Limitations', 'Verification'))) {
              errors.push('Address Known Limitations (None is acceptable).');
            }

            if (checked('Material AI Contribution') && !substantive(labeled('AI Contribution Details', 'AI Contribution'))) {
              errors.push('Describe material AI contributions and human validation.');
            }

            for (const item of [
              'I understand the code and its intended behavior.',
              'I have reviewed and validated AI-generated changes, if any.',
              'I have disclosed material AI contributions.',
              'This change is ready for review.'
            ]) {
              if (!declared(item)) errors.push(`Missing author declaration: ${item}`);
            }

            if (errors.length) core.setFailed(errors.join('\n'));
            else core.info('Hypercraft PR validation passed.');

